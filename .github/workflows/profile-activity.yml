name: Refresh profile activity

on:
  workflow_dispatch:
  schedule:
    - cron: "23 23 * * *"
  push:
    branches: [main, master]
    paths:
      - "README.md"
      - "scripts/update_profile.py"
      - ".github/workflows/profile-activity.yml"

permissions: {}

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'shakil42051/shakil42051'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate the activity card from GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: shakil42051
        run: python3 scripts/update_profile.py

      - name: Commit the refreshed card
        shell: bash
        run: |
          git add -- assets/profile/activity.svg
          if git diff --cached --quiet; then
            echo "The activity card is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile activity [skip ci]"
          git push
