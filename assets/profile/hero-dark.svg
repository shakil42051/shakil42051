    <!-- Two-deck editorial display name -->
    <text x="38" y="90" fill="#9ba3b4" font-size="24" font-weight="500" letter-spacing="-0.4">Md. Shakil Ahmad</text>
    <text x="38" y="136" fill="#f3f5f8" font-size="46" font-weight="800" letter-spacing="-1.4">Nahid<tspan fill="#f59e0b">.</tspan></text>

