<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Md. Shakil Ahmad Nahid — Computer Science &amp; Engineering</title>
  <desc id="hero-desc">CSE undergraduate at Southeast University in Dhaka, Bangladesh. Building Android apps in Kotlin, web tools in JavaScript and Node.js, and 3D graphics in C++ and OpenGL.</desc>
  <defs>
    <pattern id="architectural-dots-dark" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1c2433" />
    </pattern>
    <clipPath id="vp-clip-dark">
      <rect x="564" y="20" width="314" height="220" rx="11" />
    </clipPath>
    <linearGradient id="vp-glow-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.0" />
    </linearGradient>
    <style>
      @media (prefers-reduced-motion: reduce) {
        .anim { display: none; }
      }
    </style>
  </defs>

